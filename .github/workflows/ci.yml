# -----------------------------------------------------------------------------
# Continuous integration: every pull request, and the quality gate of the
# Release workflow (workflow_call) on every push to main. No `push` trigger of
# its own on main: release.yml runs it there, so a release is never cut from a
# commit whose checks failed.
#
#   1. Prettier, ESLint and the tests, on Node 22 (the oldest version
#      `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks, without the image check (the image of a
#      version only exists once it is released);
#   3. the Docker image, built for amd64 and never pushed, then started like
#      Gladys runs it: a broken Dockerfile or a module that does not load
#      shows up here rather than in a release.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Checks only read the code: no write scope for the token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gladys-nasa:ci

      # The image as Gladys runs it (read-only, unprivileged, 256 MB, no
      # network): every module loads, a NeoWs feed, an EPIC list and an EONET
      # answer parse, a flood polygon contains its house.
      - name: Smoke test of the image
        run: |
          set -euo pipefail
          docker run --rm --read-only --memory 256m --network none --user node \
            --tmpfs /data:uid=1000,gid=1000 --entrypoint node gladys-nasa:ci \
            --input-type=module -e "
              const { createApp } = await import('/app/src/app.js');
              const { parseFeed, weekOf } = await import('/app/src/neo.js');
              const { parseEpic, imagesFor } = await import('/app/src/epic.js');
              const { parseEvents, eventsNear } = await import('/app/src/eonet.js');
              const now = Date.parse('2026-11-05T19:45:00Z');
              const feed = parseFeed({ near_earth_objects: { '2026-11-07': [{ id: '3393818', name: '(2007 VV83)', close_approach_data: [{ epoch_date_close_approach: 1794010860000, miss_distance: { kilometers: '8343148.38', lunar: '21.69' }, orbiting_body: 'Earth' }] }] } });
              const images = parseEpic([{ image: 'epic_1b_20261103112447', date: '2026-11-03 11:21:58', centroid_coordinates: { lat: -6, lon: -4.43 } }]);
              const events = parseEvents({ events: [{ id: 'EONET_25500', title: 'Flood in France 1104243', categories: [{ id: 'floods' }], geometry: [{ date: '2026-10-21T00:00:00Z', type: 'Polygon', coordinates: [[[4, 43], [5, 43], [5, 44], [4, 44], [4, 43]]] }] }] });
              const near = eventsNear(events, { latitude: 43.5, longitude: 4.5 }, { radiusKm: 100, since: now - 30 * 864e5 });
              if (typeof createApp !== 'function' || weekOf(feed, now).closest.name !== '2007 VV83' || imagesFor(images, 6)[0].lon !== -4.43 || near[0]?.distance !== 0 || near[0].title !== 'Flood in France') {
                process.exit(1);
              }
              console.log('modules load, NeoWs, EPIC and EONET parse, a polygon contains its house');
            "
